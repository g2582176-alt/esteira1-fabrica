name: Esteira 1 - Multi-Deploy

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  esteira1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout publico
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Detector
        run: node 1_pesquisador.js || echo OK
        continue-on-error: true
      - name: Gerador
        run: node 3_programador.js || echo OK
        continue-on-error: true
      - name: Setup git
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.email esteira1@bot
          git config --global user.name Esteira1Bot
      - name: Push BM-Automacao
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git /tmp/bm-auto 2>/dev/null || true
          if [ -d /tmp/bm-auto ]; then
            mkdir -p /tmp/bm-auto/esteira_1_fabrica_software/output
            cp -r output/* /tmp/bm-auto/esteira_1_fabrica_software/output/ 2>/dev/null || true
            cd /tmp/bm-auto
            git add -A
            git diff --staged --quiet || git commit -m "feat: esteira gerou codigo"
            git push https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git main
          fi
      - name: Push on-brigadista
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:$GH_PAT@github.com/g2582176-alt/on-brigadista-app.git /tmp/bri 2>/dev/null || true
          if [ -d /tmp/bri ]; then
            mkdir -p /tmp/bri/esteira_1_fabrica_software/output
            cp -r output/* /tmp/bri/esteira_1_fabrica_software/output/ 2>/dev/null || true
            cd /tmp/bri
            git add -A
            git diff --staged --quiet || git commit -m "feat: esteira gerou codigo"
            git push https://x-access-token:$GH_PAT@github.com/g2582176-alt/on-brigadista-app.git main
          fi
      - name: Push bm-system-app
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:$GH_PAT@github.com/g2582176-alt/bm-system-app.git /tmp/bmsys 2>/dev/null || true
          if [ -d /tmp/bmsys ]; then
            mkdir -p /tmp/bmsys/esteira_1_fabrica_software/output
            cp -r output/* /tmp/bmsys/esteira_1_fabrica_software/output/ 2>/dev/null || true
            cd /tmp/bmsys
            git add -A
            git diff --staged --quiet || git commit -m "feat: esteira gerou codigo"
            git push https://x-access-token:$GH_PAT@github.com/g2582176-alt/bm-system-app.git main
          fi
      - name: Push gestaodeterceiros
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:$GH_PAT@github.com/g2582176-alt/gestaodeterceiros.git /tmp/gt 2>/dev/null || true
          if [ -d /tmp/gt ]; then
            mkdir -p /tmp/gt/esteira_1_fabrica_software/output
            cp -r output/* /tmp/gt/esteira_1_fabrica_software/output/ 2>/dev/null || true
            cd /tmp/gt
            git add -A
            git diff --staged --quiet || git commit -m "feat: esteira gerou codigo"
            git push https://x-access-token:$GH_PAT@github.com/g2582176-alt/gestaodeterceiros.git main
          fi
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: Deploy SFTP com SSL ignore
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          for dir in output/codigo_*; do
            if [ -d "$dir" ]; then
              nome=$(basename $dir | sed "s/codigo_//")
              echo "Deploying $nome..."
              lftp -u "$SFTP_USER","$SFTP_PASSWORD" -e "set ssl:verify-certificate no; mirror -R --overwrite --delete $dir/ /modulos/sst/$nome/; bye" $SFTP_HOST 2>&1
              echo "OK $nome"
            fi
          done
      - name: Done
        if: always()
        run: echo ESTEIRA_DONE