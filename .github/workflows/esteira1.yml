name: Esteira 1 - Auto Deploy v11

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  esteira1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Instalar deps
        run: npm install 2>/dev/null || true
        
      - name: Detector de modulos
        env:
          BMSYSTEM_API_KEY: ${{ secrets.BMSYSTEM_API_KEY }}
        run: node 1_pesquisador.js || echo OK
          
      - name: Pesquisa de Tendencias
        run: |
          node 2_pesquisador_tendencias.js || echo OK
          node 2_web_scraper.js || echo OK
        
      - name: Analise IA
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: node 4_analisador_ia.js || echo OK

      - name: Completar modulos
        run: node 5_completar.js || echo OK

      - name: Melhorar Treinamentos
        run: node 6_melhorar_treinamentos.js || echo OK

      - name: Gerador de codigo
        run: node 3_programador.js || echo OK

      - name: Gerador IA
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: node 3_gerador_ia.js || echo OK
        
      - name: Validar PHP gerado
        run: |
          echo === VALIDACAO PHP ===
          for f in $(find output -name "*.php" 2>/dev/null); do
            php -l "$f" 2>&1 | grep -q "No syntax errors" && echo "OK: $(basename $f)" || echo "ERRO: $(basename $f)"
          done
        continue-on-error: true
        
      - name: Validacao de erros
        run: node 4_validar.js || echo OK
        
      - name: Commit no BM-Automacao
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo === COMMIT BM-AUTOMACAO ===
          git clone https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git /tmp/bm-auto 2>/dev/null || (cd /tmp/bm-auto && git pull)
          if [ -d /tmp/bm-auto ]; then
            cd /tmp/bm-auto
            cp -r ../output/* esteira_1_fabrica_software/output/ 2>/dev/null || true
            echo Arquivos no output:
            find esteira_1_fabrica_software/output -name "*.php" 2>/dev/null | head -20
            git add -A
            if git diff --staged --quiet; then
              echo Nada para commitar
            else
              git commit -m "esteira: update $(date)"
              git push https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git main
              echo Commit feito
            fi
          fi
        continue-on-error: true
     
      - name: Deploy automatico
        if: always()
        run: |
          echo === DEPLOY ===
          curl -s "https://bmsystem.app/webhook.php?action=deploy-all&token=esteira1-2026-secret-deploy" -m 60
        continue-on-error: true
     
      - name: Resultado
        if: always()
        run: |
          echo ============================================
          echo ESTEIRA v11 - RESULTADO
          echo ============================================
          echo Status: ${{ job.status }}
          echo ============================================