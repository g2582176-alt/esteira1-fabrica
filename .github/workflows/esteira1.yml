name: Esteira 1 - Auto Deploy v8 (Completa)

on:
  schedule:
    # 4 horarios: 02:00, 08:00, 14:00, 20:00 UTC (23:00, 05:00, 11:00, 17:00 BRT)
    - cron: '0 2,8,14,20 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      modulo:
        description: 'Modulo especifico para deploy (opcional)'
        required: false
        default: ''

jobs:
  esteira1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Instalar deps
        run: npm install 2>/dev/null || true
        
      # ============================================
      # FASE 1: DETECTOR DE MODULOS
      # ============================================
      - name: Detector de modulos
        id: detector
        env:
          BMSYSTEM_API_KEY: ${{ secrets.BMSYSTEM_API_KEY }}
        run: |
          echo "=== FASE 1: DETECTOR DE MODULOS ==="
          echo "Verificando Fabrica de Software e servidor..."
          node 1_pesquisador.js || echo OK
          
          # Mostra resultado
          if [ -f output/modulos_faltantes.json ]; then
            echo ""
            echo "Modulos faltantes:"
            cat output/modulos_faltantes.json | grep -A5 '"faltantes"' || echo "0"
          fi
        
      # ============================================
      # FASE 2: PESQUISA DE TENDENCIAS
      # ============================================
      - name: Pesquisa de Tendencias
        id: tendencias
        run: |
          echo "=== FASE 2: TENDENCIAS SST ==="
          node 2_pesquisador_tendencias.js || echo "Tendencias OK"
          node 2_web_scraper.js || echo "Web scraping OK"
        
      # ============================================
      # FASE 3: COMPLETAR MODULOS INCOMPLETOS
      # ============================================
      - name: Completar modulos incompletos
        run: |
          echo "=== FASE 3: COMPLETAR MODULOS ==="
          node 5_completar.js || echo OK
          
          if [ -f output/completados.json ]; then
            echo "Modulos completados:"
            cat output/completados.json
          fi
        
      # ============================================
      # FASE 4: GERADOR DE CODIGO
      # ============================================
      - name: Gerador de codigo
        run: |
          echo "=== FASE 4: GERADOR DE CODIGO ==="
          node 3_programador.js || echo OK
          echo "Arquivos gerados: $(find output -name '*.php' 2>/dev/null | wc -l)"
        
      # ============================================
      # FASE 5: VALIDAR PHP (Sintaxe)
      # ============================================
      - name: Validar PHP gerado
        id: validate
        run: |
          echo "=== FASE 5: VALIDACAO PHP ==="
          
          PHP_COUNT=$(find output -name '*.php' 2>/dev/null | wc -l)
          if [ "$PHP_COUNT" -eq 0 ]; then
            echo "Nenhum arquivo PHP para validar"
            exit 0
          fi
          
          ERROS=0
          for f in $(find output -name "*.php"); do
            RESULT=$(php -l "$f" 2>&1)
            if echo "$RESULT" | grep -q "No syntax errors"; then
              echo "OK: $(basename $f)"
            else
              echo "ERRO: $(basename $f)"
              echo "$RESULT"
              ERROS=$((ERROS + 1))
            fi
          done
          
          if [ $ERROS -gt 0 ]; then
            echo ""
            echo "ATENCAO: $ERROS arquivo(s) com erro de sintaxe!"
            exit 1
          else
            echo ""
            echo "Todos os arquivos PHP validados com sucesso!"
          fi
        
      # ============================================
      # FASE 6: VALIDACAO DE ERROS E CORRECAO
      # ============================================
      - name: Validacao de erros
        run: |
          echo "=== FASE 6: VALIDACAO DE ERROS ==="
          node 4_validar.js || echo "Validacao OK"
        
      # ============================================
      # FASE 7: COMMIT NO BM-AUTOMACAO
      # ============================================
      - name: Commit no BM-Automacao
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "=== FASE 7: COMMIT BM-AUTOMACAO ==="
          git config --global user.email "esteira1@bot"
          git config --local user.name "Esteira1Bot"
          git clone https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git /tmp/bm-auto 2>/dev/null || true
          if [ -d /tmp/bm-auto ]; then
            cd /tmp/bm-auto
            rm -rf esteira_1_fabrica_software/output
            mkdir -p esteira_1_fabrica_software/output
            cp -r ../output/* esteira_1_fabrica_software/output/ 2>/dev/null || true
            git add -A
            git diff --staged --quiet || git commit -m "esteira: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git main || true
            echo "Commit feito!"
          fi
        continue-on-error: true
      
      # ============================================
      # FASE 8: DEPLOY
      # ============================================
      - name: Deploy automatico
        if: always()
        run: |
          echo "=== FASE 8: DEPLOY NO SERVIDOR ==="
          
          RESULT=$(curl -s "https://bmsystem.app/webhook.php?action=deploy-all&token=esteira1-2026-secret-deploy" -m 60)
          echo "$RESULT"
          
          if echo "$RESULT" | grep -q '"success": true'; then
            echo "Deploy OK!"
          fi
        continue-on-error: true
      
      # ============================================
      # RESULTADO
      # ============================================
      - name: Resultado
        if: always()
        run: |
          echo "============================================"
          echo "  ESTEIRA 1 - RESULTADO"
          echo "============================================"
          echo "Status: ${{ job.status }}"
          echo "Data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "============================================"
