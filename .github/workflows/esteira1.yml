name: Esteira 1 - Auto Deploy v7 (com validacao)

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  esteira1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Instalar deps
        run: npm install 2>/dev/null || true
        
      - name: Detector de modulos
        run: node 1_pesquisador.js || echo OK
        continue-on-error: true
        
      - name: Gerador de codigo
        run: node 3_programador.js || echo OK
        continue-on-error: true
      
      - name: Validar PHP gerado
        run: |
          echo "=== Validando arquivos PHP gerados ==="
          ERROS=0
          for f in $(find output -name "*.php"); do
            RESULT=$(php -l "$f" 2>&1)
            if echo "$RESULT" | grep -q "No syntax errors"; then
              echo "OK: $f"
            else
              echo "ERRO: $f"
              echo "$RESULT"
              ERROS=$((ERROS + 1))
            fi
          done
          if [ $ERROS -gt 0 ]; then
            echo ""
            echo "ATENCAO: $ERROS arquivo(s) com erro de sintaxe!"
            echo "Deploy sera PULADO para evitar corromper o servidor."
            exit 1
          else
            echo ""
            echo "Todos os arquivos PHP validados com sucesso!"
          fi
        continue-on-error: false
        
      - name: Commit no BM-Automacao
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.email "esteira1@bot"
          git config --local user.name "Esteira1Bot"
          git clone https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git /tmp/bm-auto 2>/dev/null || true
          if [ -d /tmp/bm-auto ]; then
            cd /tmp/bm-auto
            rm -rf esteira_1_fabrica_software/output
            mkdir -p esteira_1_fabrica_software/output
            cp -r ../output/* esteira_1_fabrica_software/output/ 2>/dev/null || true
            git add -A
            git diff --staged --quiet || git commit -m "esteira: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git main || true
            echo "Commit feito"
          fi
        continue-on-error: true
      
      - name: Deploy automatico no servidor
        if: always()
        run: |
          echo "=== DEPLOY NO SERVIDOR ==="
          
          DEPLOY_OK=true
          
          # Verifica se validacao passou
          if [ "${{ steps.validate_conclusion }}" = "failure" ]; then
            echo "ERRO: Validacao PHP falhou - PULANDO deploy"
            DEPLOY_OK=false
            exit 1
          fi
          
          if [ "$DEPLOY_OK" = true ]; then
            echo "1. Deploy treinamentos..."
            RESULT=$(curl -s "https://bmsystem.app/webhook.php?action=deploy-treinamentos&token=esteira1-2026-secret-deploy" -m 60)
            echo "$RESULT"
            
            if echo "$RESULT" | grep -q '"success": true'; then
              echo "Deploy OK!"
            else
              echo "Deploy FALHOU!"
              exit 1
            fi
          fi
        continue-on-error: true
      
      - name: Resultado
        if: always()
        run: |
          echo "============================="
          echo "ESTEIRA 1: ${{ job.status }}"
          echo "Proxima: 02:00, 08:00, 14:00, 20:00 UTC"
          echo "============================="
