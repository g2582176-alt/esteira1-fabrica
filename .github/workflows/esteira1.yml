name: Esteira 1 - Multi-Deploy v2

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  esteira1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout publico
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Detector
        run: node 1_pesquisador.js || echo OK
        continue-on-error: true
      - name: Gerador
        run: node 3_programador.js || echo OK
        continue-on-error: true
      - name: Setup git
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.email esteira1@bot
          git config --global user.name Esteira1Bot
      - name: Push BM-Automacao
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git /tmp/bm-auto 2>/dev/null || true
          if [ -d /tmp/bm-auto ]; then
            mkdir -p /tmp/bm-auto/esteira_1_fabrica_software/output
            cp -r output/* /tmp/bm-auto/esteira_1_fabrica_software/output/ 2>/dev/null || true
            cd /tmp/bm-auto
            git add -A
            git diff --staged --quiet || git commit -m "feat: esteira gerou codigo"
            git push https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git main || true
          fi
        continue-on-error: true
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: Deploy SFTP - Tentar todas portas
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          for dir in output/codigo_*; do
            if [ -d "$dir" ]; then
              nome=$(basename $dir | sed "s/codigo_//")
              echo "Deploying $nome..."
              # Tentar porta 21 sem SSL
              lftp -u "$SFTP_USER","$SFTP_PASSWORD" -e "set ssl:verify-certificate no; mirror -R --overwrite --delete $dir/ /www/modulos/sst/$nome/; bye" $SFTP_HOST 2>&1 || true
              # Tentar porta 990 com SSL
              lftp -u "$SFTP_USER","$SFTP_PASSWORD" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; mirror -R --overwrite --delete $dir/ /www/modulos/sst/$nome/; bye" ftps://$SFTP_HOST:990 2>&1 || true
              # Tentar FTPS explicito
              lftp -u "$SFTP_USER","$SFTP_PASSWORD" -e "set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true; mirror -R --overwrite --delete $dir/ /www/modulos/sst/$nome/; bye" $SFTP_HOST 2>&1 || true
            fi
          done
      - name: Done
        if: always()
        run: echo ESTEIRA_DONE