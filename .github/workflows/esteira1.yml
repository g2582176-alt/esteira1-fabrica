name: Esteira 1 - Multi-Deploy

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  esteira1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout publico
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Detector
        run: node 1_pesquisador.js || echo OK
        continue-on-error: true
      - name: Gerador
        run: node 3_programador.js || echo OK
        continue-on-error: true
      - name: Test SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          echo "Testando conexao com $SFTP_HOST..."
          curl -v --user "$SFTP_USER:$SFTP_PASSWORD" "ftp://$SFTP_HOST/" 2>&1 | head -20
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: Deploy SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          for dir in output/codigo_*; do
            if [ -d "$dir" ]; then
              nome=$(basename $dir | sed "s/codigo_//")
              echo "Deploying $nome..."
              lftp -d -u "$SFTP_USER","$SFTP_PASSWORD" -e "mirror -R --overwrite $dir/ /modulos/sst/$nome/; bye" $SFTP_HOST 2>&1 || echo "LFTP failed"
            fi
          done
      - name: Done
        if: always()
        run: echo ESTEIRA_DONE