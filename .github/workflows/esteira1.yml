name: Esteira 1

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  esteira1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout publico
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Detector
        run: node 1_pesquisador.js || echo OK
        continue-on-error: true
      - name: Gerador
        run: node 3_programador.js || echo OK
        continue-on-error: true
      - name: Setup git
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.email esteira1@bot
          git config --global user.name Esteira1Bot
          git clone https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git /tmp/privado
      - name: Copiar output
        run: |
          mkdir -p /tmp/privado/esteira_1_fabrica_software/output
          cp -r output/* /tmp/privado/esteira_1_fabrica_software/output/ 2>/dev/null || true
          cd /tmp/privado
          git add -A
          git diff --staged --quiet || git commit -m "feat: esteira gerou codigo"
      - name: Push para privado
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd /tmp/privado
          git push https://x-access-token:$GH_PAT@github.com/g2582176-alt/BM-Automacao.git main
      - name: Setup SSH key
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
      - name: Deploy SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          for dir in output/codigo_*; do
            if [ -d "$dir" ]; then
              nome=$(basename $dir | sed "s/codigo_//")
              echo "Deploying $nome..."
              sshpass -p "$SFTP_PASSWORD" scp -o StrictHostKeyChecking=no -r "$dir" "$SFTP_USER@$SFTP_HOST:/modulos/sst/$nome/" 2>/dev/null || echo "SCP failed for $nome"
            fi
          done
      - name: Done
        if: always()
        run: echo ESTEIRA_DONE