name: Debug Upload Detalhado

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: Upload com debug
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          TS=$(date +%s)
          echo "=== Upload detalhado em /modulos/sst/treinamentos/ ==="
          echo "DEBUG_$TS" > /tmp/debug_$TS.txt
          
          # Usar lftp com verbose maximo
          lftp -d -u "$SFTP_USER","$SFTP_PASSWORD" -e "
            set ssl:verify-certificate no
            set verbose:level 10
            cd /modulos/sst/treinamentos
            pwd
            put /tmp/debug_$TS.txt
            ls
            bye
          " $SFTP_HOST 2>&1 | tail -50
