name: Fix Index PHP

on: workflow_dispatch

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: Sobrescrever index.php
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          # Verificar conexao
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -e "ls /modulos/sst/treinamentos/" $SFTP_HOST
          echo "---"
          echo '<?php echo "Modulo Treinamentos - CONCLUIDO em " . date("Y-m-d H:i:s") . " - Gerado pela Esteira 1"; ?>' > /tmp/new_index.php
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -e "put /tmp/new_index.php -o /modulos/sst/treinamentos/index.php" $SFTP_HOST
          echo "Upload OK"
