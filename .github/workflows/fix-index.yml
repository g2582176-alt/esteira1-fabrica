name: Testar FTP

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Listar com PASV
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          echo "=== Listar raiz com PASV ==="
          curl --ftp-pasv --user "$SFTP_USER:$SFTP_PASSWORD" "ftp://$SFTP_HOST/" 2>&1
          echo ""
          echo "=== Listar com PASV e --list-only ==="
          curl --list-only --ftp-pasv --user "$SFTP_USER:$SFTP_PASSWORD" "ftp://$SFTP_HOST/" 2>&1
      - name: NLST
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          echo "=== NLST raiz ==="
          curl --ftp-pasv --user "$SFTP_USER:$SFTP_PASSWORD" -l "ftp://$SFTP_HOST/" 2>&1
