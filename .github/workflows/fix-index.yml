name: Fix Index PHP

on: workflow_dispatch

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Test FTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          echo "Host: $SFTP_HOST"
          echo "User: $SFTP_USER"
          curl -v --user "$SFTP_USER:$SFTP_PASSWORD" "ftp://$SFTP_HOST/modulos/sst/treinamentos/" 2>&1 | head -20
      - name: Upload PHP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          printf '<?php echo "Treinamentos OK - " . date("Y-m-d H:i:s"); ?>' > /tmp/novo.php
          cat /tmp/novo.php
          echo "---"
          curl -v --user "$SFTP_USER:$SFTP_PASSWORD" -T /tmp/novo.php "ftp://$SFTP_HOST/modulos/sst/treinamentos/index.php" 2>&1 | head -10
