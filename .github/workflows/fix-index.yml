name: Descobrir Caminho Real

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Testar caminhos comuns
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          TS=$(date +%s)
          echo "teste_$TS" > /tmp/teste_$TS.txt
          echo "Tentando /public_html/modulos/sst/treinamentos/index.php ..."
          curl --user "$SFTP_USER:$SFTP_PASSWORD" -T /tmp/teste_$TS.txt "ftp://$SFTP_HOST/public_html/modulos/sst/treinamentos/index.php" 2>&1 | tail -5
          echo "---"
          echo "Tentando /www/modulos/sst/treinamentos/index.php ..."
          curl --user "$SFTP_USER:$SFTP_PASSWORD" -T /tmp/teste_$TS.txt "ftp://$SFTP_HOST/www/modulos/sst/treinamentos/index.php" 2>&1 | tail -5
          echo "---"
          echo "Tentando raiz /modulos/sst/treinamentos/index.php ..."
          curl --user "$SFTP_USER:$SFTP_PASSWORD" -T /tmp/teste_$TS.txt "ftp://$SFTP_HOST/modulos/sst/treinamentos/index.php" 2>&1 | tail -5
          echo "---"
          echo "Tentando /home/bmsystem/modulos/sst/treinamentos/index.php ..."
          curl --user "$SFTP_USER:$SFTP_PASSWORD" -T /tmp/teste_$TS.txt "ftp://$SFTP_HOST/home/bmsystem/modulos/sst/treinamentos/index.php" 2>&1 | tail -5
