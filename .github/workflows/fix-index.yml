name: Debug Upload Corrigido

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: Upload com debug
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          TS=$(date +%s)
          echo "DEBUG_$TS" > /tmp/debug_$TS.txt
          
          # Script lftp em arquivo
          cat > /tmp/lftp_script.txt << 'LFTPEOF'
set ssl:verify-certificate no
cd /modulos/sst/treinamentos
pwd
put /tmp/debug_TS_PLACEHOLDER.txt
ls
bye
LFTPEOF
          sed -i "s/TS_PLACEHOLDER/$TS/g" /tmp/lftp_script.txt
          cat /tmp/lftp_script.txt
          echo "---"
          lftp -d -u "$SFTP_USER","$SFTP_PASSWORD" -f /tmp/lftp_script.txt $SFTP_HOST 2>&1 | tail -30
