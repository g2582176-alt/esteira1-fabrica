name: Setup SFTP Secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-secrets.yml'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Adicionar SFTP_HOST
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const value = 'ftp.bmsystem.app';
            const pubKeyResp = await github.rest.actions.getRepoPublicKey({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const key = pubKeyResp.data.key;
            const keyId = pubKeyResp.data.key_id;
            const encrypted = crypto.publicEncrypt(
              {
                key: key,
                padding: crypto.constants.RSA_PKCS1_PADDING
              },
              Buffer.from(value)
            ).toString('base64');
            await github.rest.actions.createOrUpdateSecretForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              secret_name: 'SFTP_HOST',
              encrypted_value: encrypted,
              key_id: keyId
            });
            console.log('SFTP_HOST OK');
            
      - name: Adicionar SFTP_USER
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const value = 'bmsystem';
            const pubKeyResp = await github.rest.actions.getRepoPublicKey({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const key = pubKeyResp.data.key;
            const keyId = pubKeyResp.data.key_id;
            const encrypted = crypto.publicEncrypt(
              {
                key: key,
                padding: crypto.constants.RSA_PKCS1_PADDING
              },
              Buffer.from(value)
            ).toString('base64');
            await github.rest.actions.createOrUpdateSecretForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              secret_name: 'SFTP_USER',
              encrypted_value: encrypted,
              key_id: keyId
            });
            console.log('SFTP_USER OK');
            
      - name: Adicionar SFTP_PASSWORD
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const value = 'Acesso-ao-site*123';
            const pubKeyResp = await github.rest.actions.getRepoPublicKey({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const key = pubKeyResp.data.key;
            const keyId = pubKeyResp.data.key_id;
            const encrypted = crypto.publicEncrypt(
              {
                key: key,
                padding: crypto.constants.RSA_PKCS1_PADDING
              },
              Buffer.from(value)
            ).toString('base64');
            await github.rest.actions.createOrUpdateSecretForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              secret_name: 'SFTP_PASSWORD',
              encrypted_value: encrypted,
              key_id: keyId
            });
            console.log('SFTP_PASSWORD OK');
